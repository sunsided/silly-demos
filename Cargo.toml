[package]
name = "silly-demos"
version = "0.1.0"
description = "Small interactive geometry and simulation demos in Rust/WebAssembly, drawn as engineering sketches in the browser"
keywords = ["wasm", "geometry", "collision-detection", "simulation", "visualization"]
categories = ["wasm", "mathematics", "simulation", "game-development", "visualization"]
authors = ["Markus Mayer <widemeadows@gmail.com>"]
repository = "https://github.com/sunsided/silly-demos"
homepage = "https://sunsided.github.io/silly-demos/"
license = "MIT OR Apache-2.0 OR EUPL-1.2"
edition = "2024"

[workspace]
members = ["crates/ann", "crates/rover", "crates/som", "crates/stream"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
ann = { path = "crates/ann" }
rover = { path = "crates/rover" }
som = { path = "crates/som" }
stream = { path = "crates/stream" }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
wasm-bindgen-test = "0.3.79"

# Every item is documented, private ones included; `task lint` denies warnings.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"

[profile.release]
opt-level = "s"
lto = "fat"

# The rover simulation runs whole explorations in its tests; unoptimized it
# takes over a minute.
[profile.dev.package.rover]
opt-level = 2

# The simulation's inner loops are worth the extra bytes.
[profile.release.package.rover]
opt-level = 3

# The SOM tests train whole maps.
[profile.dev.package.som]
opt-level = 2

[profile.release.package.som]
opt-level = 3

[profile.dev.package.stream]
opt-level = 2

[profile.release.package.stream]
opt-level = 3

# Building the graphs takes millions of distances.
[profile.dev.package.ann]
opt-level = 2

[profile.release.package.ann]
opt-level = 3
