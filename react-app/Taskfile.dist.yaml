# React/Vite frontend. Expects the WASM package in ../pkg (run `task build:wasm` at the root).
# https://taskfile.dev
version: '3'

vars:
  RUN: yarn   # yarn classic — not npm

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  install:
    desc: Install frontend dependencies from yarn.lock
    preconditions:
      - sh: command -v yarn
        msg: "yarn not found — install Node.js 20.19+ and run: corepack enable"
    sources:
      - package.json
      - yarn.lock
    generates:
      - node_modules/.yarn-integrity
    cmds:
      - yarn install --frozen-lockfile

  wasm:check:
    internal: true
    preconditions:
      - sh: test -f ../pkg/silly_demos.js
        msg: "WASM package missing — run `task build:wasm` in the repository root"

  dev:
    desc: Start the Vite dev server
    deps: [install, wasm:check]
    cmds:
      - '{{.RUN}} dev {{.CLI_ARGS}}'

  build:
    desc: Typecheck and build the production bundle into dist/
    deps: [install, wasm:check]
    cmds:
      - '{{.RUN}} build'

  preview:
    desc: Serve the production bundle from dist/
    deps: [install]
    cmds:
      - '{{.RUN}} preview {{.CLI_ARGS}}'

  check:
    desc: Typecheck the frontend
    aliases: [lint]
    deps: [install, wasm:check]
    cmds:
      - '{{.RUN}} lint'

  clean:
    desc: Remove the build output and Vite cache
    cmds:
      - rm -rf dist node_modules/.vite
