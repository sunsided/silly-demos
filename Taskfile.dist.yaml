# Rust/WASM core at the root, SvelteKit frontend in web/ (included as `web`).
# https://taskfile.dev
version: '3'

includes:
  web:
    taskfile: web/Taskfile.dist.yaml
    dir: web

vars:
  # The default cargo target is wasm32 (.cargo/config.toml); unit tests and
  # clippy for tests run on the host instead.
  HOST:
    sh: "rustc -vV | sed -n 's/host: //p'"

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  build:wasm:
    desc: Build the WASM package into pkg/ (pass extra wasm-pack flags after --)
    aliases: [wasm]
    preconditions:
      - sh: command -v wasm-pack
        msg: "wasm-pack not found — install from https://rustwasm.github.io/wasm-pack/installer/"
    sources:
      - Cargo.toml
      - Cargo.lock
      - src/**/*.rs
      - crates/*/Cargo.toml
      - crates/*/src/**/*.rs
    generates:
      - pkg/silly_demos.js
      - pkg/silly_demos_bg.wasm
    cmds:
      - wasm-pack build --target web {{.CLI_ARGS}}

  build:
    desc: Production build of WASM package and frontend
    cmds:
      - task: build:wasm
      - task: web:build

  dev:
    desc: Build WASM and start the frontend dev server
    deps: [build:wasm]
    cmds:
      - task: web:dev

  preview:
    desc: Build everything and preview the production bundle
    cmds:
      - task: build
      - task: web:preview

  test:
    desc: Run Rust unit tests natively (all workspace crates)
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo test --workspace --lib --target {{.HOST}} {{.CLI_ARGS}}

  test:wasm:
    desc: Run the exported API compiled to wasm32 in Node (tests/web.rs)
    preconditions:
      - sh: command -v wasm-pack
        msg: "wasm-pack not found — install from https://rustwasm.github.io/wasm-pack/installer/"
      - sh: command -v node
        msg: "node not found — wasm-pack runs the wasm32 tests in Node"
    cmds:
      - wasm-pack test --node {{.CLI_ARGS}}

  test:pkg:
    desc: Check the generated JS package from Node, as the frontend uses it (tests/js)
    deps: [build:wasm]
    preconditions:
      - sh: command -v node
        msg: "node not found — install from https://nodejs.org/"
    cmds:
      - node --test 'tests/js/*.test.mjs'

  fmt:
    desc: Format Rust code
    aliases: [format]
    cmds:
      - cargo fmt --all

  lint:
    desc: Lint Rust code (including tests) and typecheck the frontend
    cmds:
      - cargo clippy --workspace --lib --tests --target {{.HOST}} -- -D warnings
      # tests/web.rs only compiles for wasm32.
      - cargo clippy --tests --target wasm32-unknown-unknown -- -D warnings
      - task: web:check

  lint:fix:
    desc: Auto-fix Rust lint issues and format
    aliases: [fix]
    cmds:
      - cargo clippy --workspace --lib --tests --target {{.HOST}} --fix --allow-staged
      - cargo fmt --all

  check:
    desc: Run static checks (formatting, typecheck)
    cmds:
      - cargo fmt --all --check
      - task: web:check

  ci:
    desc: Full CI sequence — checks, lint, tests, production build
    cmds:
      - task: check
      - task: lint
      - task: test
      - task: test:wasm
      - task: test:pkg
      - task: build

  serve:
    desc: Serve the repository root over HTTP (e.g. for wasm-test.html)
    preconditions:
      - sh: command -v python3
        msg: "python3 not found"
    vars:
      PORT: '{{ .PORT | default "8000" }}'
    cmds:
      - python3 -m http.server {{.PORT}}

  clean:
    desc: Remove Rust, WASM and frontend build artifacts
    deps: [web:clean]
    cmds:
      - cargo clean
      - rm -rf pkg
